spring.application.name=its

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=MYSQL;
spring.datasource.username=sa
spring.datasource.password=

# create, update, none, creat-drop
spring.jpa.hibernate.ddl-auto=create
#spring.jpa.database=h2
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# amazon s3
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.cloud.aws.credentials.access-key=access_key
spring.cloud.aws.credentials.secret-key=secret-ky
spring.cloud.aws.region.static=ap-northeast-2
spring.cloud.aws.s3.bucket=bucket
